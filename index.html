<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4EDE0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E3B2C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<style>:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<script>
/* Home-screen build: save backups through the browser, and keep the app available offline. */
window.claude={use:n=>Promise.resolve(n==='downloads'?{save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000);return{status:'saved'}}}:null)};
if('serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})});
</script>
<title>Gauge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: cream paper, one column. A ball of yarn whose strand trails down the page to the button that adds a pattern; projects set like an editorial page; the designer's sheet laid on the paper while knitting; the counter under her thumb. */
:root{
  --paper:#F4EDE0; --ink:#0E3B2C; --mute:#5E7A6A; --faint:#9AAB9F; --hair:#D3C9B6; --rule:#0E3B2C;
  --green:#19C85A; --on-green:#0E3B2C; --wash:#DDEFE1; --flag:#B5401F; --sheet:#FFFFFF; --shadow:rgba(14,59,44,.14);
  --sheet-wash:rgba(25,200,90,.16); --sheet-green:#19C85A; --sheet-ink:#0E3B2C; --sheet-flag:#C2261A;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E3B2C; --ink:#F3EBDC; --mute:#A9C4B3; --faint:#6E9080; --hair:#2E5E4A; --rule:#F3EBDC;
  --green:#3DF07A; --on-green:#0E3B2C; --wash:rgba(61,240,122,.18); --flag:#F0A394; --sheet:#FFFFFF; --shadow:rgba(0,0,0,.4);
  --sheet-wash:rgba(25,200,90,.16); --sheet-green:#19C85A; --sheet-ink:#0E3B2C; --sheet-flag:#C2261A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E3B2C; --ink:#F3EBDC; --mute:#A9C4B3; --faint:#6E9080; --hair:#2E5E4A; --rule:#F3EBDC;
  --green:#3DF07A; --on-green:#0E3B2C; --wash:rgba(61,240,122,.18); --flag:#F0A394; --sheet:#FFFFFF; --shadow:rgba(0,0,0,.4);
  --sheet-wash:rgba(25,200,90,.16); --sheet-green:#19C85A; --sheet-ink:#0E3B2C; --sheet-flag:#C2261A; color-scheme:dark}
html{-webkit-text-size-adjust:100%;height:100%}
*,*::before,*::after{box-sizing:border-box}
body{min-height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;padding-inline:20px;padding-block:0 0;-webkit-font-smoothing:antialiased}
#app{max-width:600px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0}
.tnum{font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tlink{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);border-bottom:1.5px solid var(--ink);padding-bottom:2px;cursor:pointer}
.tlink.danger{color:var(--flag);border-color:var(--flag)}
.msg{font-size:14px;color:var(--mute);margin:14px 0 0}

/* home */
.home{position:relative;flex:1;display:flex;flex-direction:column;padding-bottom:30px}
.strand{position:absolute;right:16px;top:300px;bottom:60px;width:2px;background:var(--green);border-radius:2px;pointer-events:none}
.mast{position:relative;height:300px;flex:none}
.mast svg{position:absolute;right:-20px;top:0;width:240px;height:300px}
.mast .eyebrow{position:absolute;left:0;top:30px}
.word{position:absolute;left:-4px;top:84px;margin:0;font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(100px,31vw,124px);line-height:1;letter-spacing:-.035em}
.tag{position:absolute;left:0;top:232px;margin:0;font-size:18px;line-height:1.35;color:var(--mute);max-width:230px}
.proj{display:grid;gap:10px;width:100%;border-top:1.5px solid var(--rule);padding:16px 44px 20px 0;color:inherit}
.proj.quiet{border-top:1px solid var(--hair);gap:6px;padding-top:14px}
.ptop{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.pname{font-family:var(--serif);font-size:42px;line-height:1;letter-spacing:-.02em;min-width:0;overflow-wrap:anywhere;text-wrap:balance}
.quiet .pname{font-size:32px;letter-spacing:-.01em}
.ratio{display:flex;gap:22px;flex-wrap:wrap;align-items:baseline;margin-top:4px}
.quiet .ratio{gap:14px;margin-top:0}
.pair{display:inline-flex;align-items:baseline;gap:7px}
.big{font-family:var(--serif);font-size:40px;line-height:1}
.quiet .big{font-size:24px}
.big.o{color:var(--faint)}
.arr{width:22px;height:14px;flex:none;align-self:center}
.quiet .arr{width:16px;height:12px}
.unit{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-left:2px}
.yarn{position:relative;height:12px;margin-top:6px}
.yarn::before{content:"";position:absolute;left:0;right:0;top:5px;border-top:2px dotted var(--hair)}
.yarn i{position:absolute;left:0;top:4.5px;height:3px;background:var(--green);border-radius:2px}
.yarn i::after{content:"";position:absolute;right:-5px;top:-3.5px;width:10px;height:10px;border-radius:50%;background:var(--green)}
.pmeta{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:500;color:var(--mute)}
.pmeta .pct{font-family:var(--serif);font-size:18px;color:var(--ink)}
.foot{margin-top:auto;padding-top:26px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.addbtn>span:first-child{white-space:nowrap}
.addbtn{display:flex;align-items:center;gap:14px;font-size:16px;font-weight:600;cursor:pointer}
.addbtn .plus{width:60px;height:60px;border-radius:50%;background:var(--green);color:var(--on-green);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:40px;line-height:1}
.addbtn:focus-within .plus{outline:2px solid var(--ink);outline-offset:3px}
.links{display:flex;gap:10px 22px;flex-wrap:wrap;align-items:baseline;padding:22px 44px 0 0;border-top:1px solid var(--hair);margin-top:26px}

/* shared controls */
.circ{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--rule);display:flex;align-items:center;justify-content:center;flex:none}
.pill{height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--rule);font-weight:600;font-size:14px;display:inline-flex;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--rule);border-radius:999px;padding:3px}
.seg button{height:32px;padding:0 16px;border-radius:999px;font-weight:600;font-size:14px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.tog{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);cursor:pointer}
.tog input{appearance:none;-webkit-appearance:none;width:34px;height:20px;border:1.5px solid var(--rule);border-radius:999px;position:relative;margin:0;flex:none;cursor:pointer;background:transparent}
.tog input::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--ink)}
.tog input:checked{background:var(--green);border-color:var(--green)}
.tog input:checked::after{left:16px;background:var(--on-green)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--rule);font-weight:600;font-size:15px}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--paper)}

/* setup */
.nav{display:flex;justify-content:space-between;align-items:center;padding-block:22px 10px}
.title-in{width:100%;background:none;border:0;border-bottom:1.5px solid var(--rule);border-radius:0;padding:4px 0 10px;font-family:var(--serif);font-size:clamp(34px,10vw,44px);line-height:1.05;letter-spacing:-.02em}
.title-in:focus{outline:none;border-bottom-color:var(--green)}
.src{margin-top:8px}
.blk{display:grid;gap:14px;padding-block:24px;border-bottom:1px solid var(--hair)}
.blkhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.gg{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:start}
.gcol{display:grid;gap:12px;min-width:0}
.garrow{padding-top:34px}
.nf{display:grid;gap:2px}
.nf input{width:100%;min-width:0;background:none;border:0;border-bottom:1.5px solid var(--rule);border-radius:0;padding:0 0 4px;font-family:var(--serif);font-size:56px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink)}
.gcol.mine .nf input{border-bottom-color:var(--green)}
.nf input::placeholder{color:var(--hair)}
.nf input:focus{outline:none;border-bottom-width:3px}
.nf span{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding-top:4px}
.found{font-size:13px;color:var(--mute);margin:0}
.sentence{font-family:var(--serif);font-size:23px;line-height:1.3;margin:0;text-wrap:pretty}
.sentence em{font-style:italic;color:var(--ink);border-bottom:2px solid var(--green)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.small{font-size:14px;color:var(--mute);margin:0;max-width:60ch;line-height:1.5}
.warn{border-left:2px solid var(--flag);padding-left:12px;color:var(--ink)}
textarea{width:100%;min-height:130px;background:transparent;border:1.5px solid var(--hair);border-radius:12px;padding:12px 14px;font-size:16px;line-height:1.5;resize:vertical}
textarea:focus{outline:none;border-color:var(--rule)}
.step{display:flex;align-items:baseline;gap:12px}
.stepn{font-family:var(--serif);font-size:44px;line-height:.8;color:var(--green)}
.steph{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.05;letter-spacing:-.01em;margin:0}
.cmp{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr);gap:10px 14px;align-items:end}
.cmp .eyebrow.mine{color:var(--ink)}
.cmp .rl{font-size:13px;font-weight:500;color:var(--mute);padding-bottom:8px;line-height:1.25}
.cin input{width:100%;min-width:0;background:none;border:0;border-bottom:1.5px solid var(--rule);border-radius:0;padding:0 0 4px;font-family:var(--serif);font-size:30px;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.cin input[type=text]{font-family:var(--sans);font-size:14px;font-weight:600;padding-bottom:8px;text-overflow:ellipsis}
.cmp .cin:nth-child(3n) input{border-bottom-color:var(--green)}
.cin input::placeholder{color:var(--hair)}
.cin input:focus{outline:none;border-bottom-width:3px}
.fitrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:start}
.fitrow .op{font-family:var(--serif);font-size:40px;color:var(--green);padding-top:6px}
.found .tlink{margin-left:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding-block:24px;border-bottom:1px solid var(--hair)}
.stat{display:grid;gap:4px;min-width:0}
.stat .big{font-size:48px}
.cta{width:100%;height:68px;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 26px;margin-top:24px}
.cta .plus{width:52px;height:52px;border-radius:50%;background:var(--green);color:var(--on-green);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:30px}
.sfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:22px 36px}

/* knit */
.khead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);margin-inline:-20px;padding:14px 20px 12px;display:grid;gap:12px}
.krow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.kname{font-family:var(--serif);font-size:28px;line-height:1;letter-spacing:-.015em;text-align:center;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kopts{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
#kbody{padding-block:14px 300px}
.sheet{background:var(--sheet);border-radius:14px;box-shadow:0 14px 34px var(--shadow),0 1px 0 rgba(14,59,44,.08);overflow:hidden}
.pages{display:grid}
.pg{position:relative;background:#FFFFFF;overflow:hidden}
.pg+.pg{border-top:1px dashed #D3C9B6}
.pg canvas{display:block}
.ov{position:absolute;inset:0;cursor:crosshair}
.ov .ruler{position:absolute;left:0;right:0;background:var(--sheet-wash);pointer-events:none}
.ov .nv{position:absolute;display:flex;align-items:center;justify-content:flex-start;background:var(--sheet-green);color:var(--sheet-ink);font-family:var(--sans);font-weight:700;white-space:nowrap;padding:0 .3em;line-height:1;border-radius:3px;font-variant-numeric:tabular-nums;pointer-events:none;letter-spacing:-.01em}
.ov .nv .o{opacity:.5;font-weight:500}
.ov .fl{position:absolute;left:5px;width:8px;height:8px;border-radius:50%;background:var(--sheet-flag);pointer-events:none}
.pages.orig .nv{display:none}
.pload{position:absolute;inset:0;display:grid;place-items:center;color:#5E7A6A;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.banner{font-size:14px;color:var(--mute);margin:0 0 12px;display:flex;gap:8px;align-items:baseline}
.banner i{width:8px;height:8px;border-radius:50%;background:var(--flag);display:inline-block;flex:none;transform:translateY(-1px)}
.tl{display:grid;gap:2px}
.ln{display:block;width:100%;padding:9px 12px;border-radius:10px;font-size:17px;line-height:1.5;overflow-wrap:anywhere;color:inherit}
.ln.head{font-family:var(--serif);font-size:24px;line-height:1.1;padding-top:24px}
.ln.done{color:var(--faint)}
.ln.cur{background:var(--wash)}
.pgsep{margin:20px 0 4px 12px}
.mk{background:var(--green);color:var(--on-green);font-weight:700;padding:0 5px;border-radius:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.mk .o{opacity:.55;font-weight:500}
.mk s{color:var(--on-green);opacity:.6;font-weight:400;margin-left:5px;font-size:.85em}
.ln.done .mk{opacity:.55}
.fnote{display:block;font-size:13px;color:var(--flag);margin-top:4px;line-height:1.4}
.fnote.note{color:var(--ink);border-left:2px solid var(--green);padding-left:8px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);box-shadow:0 -1px 0 var(--hair);padding:6px 20px calc(8px + env(safe-area-inset-bottom,0px))}
.dockin{max-width:600px;margin:0 auto}
.dsub{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dsub button{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:8px 0}
.dsub button.on{color:var(--ink)}
.ctr{position:relative;height:130px}
.ctr svg{position:absolute;left:0;bottom:0}
.ctr .minus{position:absolute;left:0;top:6px;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--rule);font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center}
.cnum{position:absolute;left:80px;right:100px;top:10px;text-align:center}
.cnum span{display:block}
.cnum .eyebrow{letter-spacing:.16em;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnum .n{font-family:var(--serif);font-size:66px;line-height:.95;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ctr .plus{position:absolute;right:0;top:22px;width:80px;height:80px;border-radius:50%;background:var(--green);color:var(--on-green);font-family:var(--serif);font-size:52px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 28px rgba(25,200,90,.32)}
/* dock: pieces, panels, status */
.pieces{display:flex;gap:8px;align-items:center;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}
.pieces::-webkit-scrollbar{display:none}
.pc{height:32px;padding:0 14px;border-radius:999px;border:1.5px solid var(--hair);font-size:13px;font-weight:600;white-space:nowrap;flex:none;color:var(--mute)}
.pc.on{border-color:var(--rule);background:var(--ink);color:var(--paper)}
.pc.add{width:32px;padding:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:22px;color:var(--ink);border-color:var(--rule)}
.pieces .tog{margin-left:auto;padding-left:8px}
.panel{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:12px 0 6px;border-top:1px solid var(--hair)}
.panel label{display:grid;gap:4px;flex:1 1 140px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.panel input{width:100%;min-width:0;background:none;border:0;border-bottom:1.5px solid var(--rule);border-radius:0;padding:2px 0 4px;font-size:22px;font-family:var(--serif);color:var(--ink)}
.panel input[type=text]{font-size:20px}
.panel input:focus{outline:none;border-bottom-color:var(--green)}
.panel .pill{height:38px}
.panel .pill.fill{background:var(--ink);color:var(--paper)}
.panel .sugg{display:flex;gap:6px;flex-wrap:wrap;flex-basis:100%}
.panel .sugg button{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--hair);font-size:13px;font-weight:600;color:var(--mute)}
.cnum .sts{font-size:13px;font-weight:500;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.cnum .sts.now{color:var(--on-green);background:var(--green);border-radius:999px;padding:2px 10px;display:inline-block;font-weight:700}
.cnum .sts.done{color:var(--ink)}
.rtag{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--sheet-ink);background:#FFFFFF;border:1px solid var(--sheet-green);border-radius:999px;padding:1px 7px;white-space:nowrap}
.lcnt{float:right;margin-left:10px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--ink);border:1.5px solid var(--green);border-radius:999px;padding:1px 8px;white-space:nowrap}
.tl.t1 .ln{font-size:20px}.tl.t1 .ln.head{font-size:27px}
.tl.t2 .ln{font-size:24px;line-height:1.45}.tl.t2 .ln.head{font-size:31px}
.aa{height:40px;padding:0 12px;border-radius:999px;border:1.5px solid var(--rule);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:2px}
.aa b{font-size:18px;font-weight:600}
.loading{padding-block:90px;display:grid;gap:10px}
.loading .n{font-family:var(--serif);font-size:48px;line-height:1}
@media (max-width:380px){.pname{font-size:38px}.big{font-size:38px}.nf input{font-size:46px}}
@media (prefers-reduced-motion:no-preference){.ln{transition:background .15s}.ov .ruler{transition:top .2s,height .2s}}
</style>

<div id="app"></div>

/* ---------- PDF storage (IndexedDB, falls back to memory) ---------- */
let idbP=null;
function idb(){if(!idbP)idbP=new Promise((res,rej)=>{try{const r=indexedDB.open('gauge',1);r.onupgradeneeded=()=>r.result.createObjectStore('pdfs');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return idbP}
async function putPdf(id,buf){S.mem[id]=buf;try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction('pdfs','readwrite');t.objectStore('pdfs').put(buf,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){}}
async function getPdf(id){if(S.mem[id])return S.mem[id];try{const db=await idb();return await new Promise((res,rej)=>{const r=db.transaction('pdfs').objectStore('pdfs').get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}catch(e){return null}}
async function delPdf(id){delete S.mem[id];try{const db=await idb();db.transaction('pdfs','readwrite').objectStore('pdfs').delete(id)}catch(e){}}
async function pdfBuf(p){return p.example?b64ToBuf(EX_B64):await getPdf(p.id)}

/* ---------- reading the PDF into lines ---------- */
/* Split a page into columns when there is a clear vertical gutter between two blocks of text. */
function columnsOf(pg){
  const its=pg.items,W=pg.w;if(its.length<12)return[its];
  const body=its.filter(t=>t.w<W*0.55);let best=null;
  const allow=Math.max(4,Math.round(its.length*0.06));
  for(let g=W*0.3;g<=W*0.7;g+=2){
    if(body.filter(t=>t.x<g&&t.x+t.w>g).length>allow)continue;
    const L=body.filter(t=>t.x+t.w<=g).length,R=body.filter(t=>t.x>=g).length;
    if(L>=5&&R>=5){const sc=Math.min(L,R);if(!best||sc>best.sc)best={g,sc}}}
  if(!best)return[its];
  // the gutter must be crossed by almost nothing that sits between the columns vertically
  const left=[],right=[];its.forEach(t=>{(t.x+t.w/2<best.g?left:right).push(t)});
  return[left,right]}
function buildLines(pages){
  const out=[];
  pages.forEach((pg,pi)=>{
    columnsOf(pg).forEach((col,ci)=>{
    const its=col.slice().sort((a,b)=>(a.y-b.y)||(a.x-b.x));const lines=[];
    for(const it of its){let L=lines.find(l=>Math.abs(l.y-it.y)<Math.max(2,Math.min(l.h,it.h)*0.45));
      if(!L){L={y:it.y,h:it.h,items:[]};lines.push(L)}L.items.push(it);L.h=Math.max(L.h,it.h)}
    lines.sort((a,b)=>a.y-b.y);
    for(const L of lines){L.items.sort((a,b)=>a.x-b.x);let text='',prevEnd=null;const items=[];
      for(const it0 of L.items){const it=Object.assign({},it0);if(text&&prevEnd!==null&&it.x-prevEnd>it.h*0.12&&!/\s$/.test(text)&&!/^\s/.test(it.str))text+=' ';
        it.start=text.length;text+=it.str;prevEnd=it.x+it.w;items.push(it)}
      const x0=Math.min(...items.map(t=>t.x)),x1=Math.max(...items.map(t=>t.x+t.w));
      if(text.trim())out.push({page:pi,col:ci,y:L.y,h:L.h,x0,x1,text:text.replace(/\s+$/,''),items})}})});
  return out}
/* Join printed lines that wrap one instruction, so sizes and counts stay together. */
function joinLines(lines){
  const out=[];const colW={};
  lines.forEach(l=>{const k=l.page+':'+l.col;colW[k]=Math.max(colW[k]||0,l.x1-l.x0)});
  const startsNew=t=>/^\s*(?:[•●▪◦]|(?:set-?up\s+)?(?:rows?|rnds?|rounds?|step)\s*\d|[A-Z][A-Za-z #\/-]{0,30}:\s)/i.test(t);
  for(const l of lines){
    const prev=out[out.length-1];
    let join=false;
    if(prev&&prev.page===l.page&&prev.col===l.col&&!prev.head&&!l.head&&!startsNew(l.text)){
      const gap=l.y-prev.lastY,lastW=prev.lastW,full=colW[l.page+':'+l.col]||lastW;
      const ended=/[.!?:]["”’)]*\s*$/.test(prev.text)&&(!/\b(?:sts?|approx|incl|rnd|rep|patt?|beg|foll|cont)\.\s*$/i.test(prev.text)||/^[A-Z]/.test(l.text));
      const open=/(?:[,(\[]|--|\band|\bor)\s*$/i.test(prev.text);
      join=gap>0&&gap<prev.lastH*1.9&&(open||(lastW>full*0.72&&!ended))}
    if(join){
      const hy=/[A-Za-z]\s*-$/.test(prev.text)&&/^[a-z]/.test(l.text);
      if(hy)prev.text=prev.text.replace(/\s*-$/,'');
      const sep=hy?'':' ',base=prev.text.length+sep.length;
      prev.text+=sep+l.text;
      l.items.forEach(it=>{const c=Object.assign({},it);c.start+=base;prev.items.push(c)});
      prev.lastY=l.y;prev.lastH=l.h;prev.lastW=l.x1-l.x0;prev.bot=Math.max(prev.bot,l.y+l.h*0.3);prev.h=Math.max(prev.h,l.h)}
    else out.push(Object.assign({},l,{items:l.items.map(it=>Object.assign({},it)),lastY:l.y,lastH:l.h,lastW:l.x1-l.x0,top:l.y-l.h*0.9,bot:l.y+l.h*0.3}))}
  return out}
function markHeads(lines){
  const hs=lines.map(l=>l.h).filter(Boolean).sort((a,b)=>a-b);const med=hs.length?hs[Math.floor(hs.length/2)]:0;
  lines.forEach(l=>{const t=l.text.trim();l.head=(med&&l.h>=med*1.15&&t.length<60)||(t.length<40&&/^[A-Z0-9 &'’:\-]+$/.test(t)&&/[A-Z]{3}/.test(t))})}
async function ensureModel(p){
  if(S.models[p.id])return S.models[p.id];
  const model={pages:[],lines:[],hasText:false,noLib:false,missing:false,title:''};
  const buf=await pdfBuf(p);
  if(!buf)model.missing=true;
  else if(!window.pdfjsLib)model.noLib=true;
  else{
    try{
      const doc=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0)),isEvalSupported:false}).promise;
      S.docs[p.id]=doc;
      try{const md=await doc.getMetadata();model.title=(md&&md.info&&md.info.Title)||''}catch(e){}
      for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i);const vp=pg.getViewport({scale:1});const tc=await pg.getTextContent();
        const items=tc.items.filter(it=>typeof it.str==='string'&&it.str.trim()).map(it=>{const t=pdfjsLib.Util.transform(vp.transform,it.transform);return{str:it.str,x:t[4],y:t[5],w:it.width,h:Math.hypot(t[2],t[3])||it.height||10}});
        let x0=vp.width,x1=0,y0=vp.height,y1=0;items.forEach(t=>{x0=Math.min(x0,t.x);x1=Math.max(x1,t.x+t.w);y0=Math.min(y0,t.y-t.h);y1=Math.max(y1,t.y+t.h*0.3)});
        const ops=await pg.getOperatorList().catch(()=>null);const hasArt=!!(ops&&ops.fnArray.some(f=>f===pdfjsLib.OPS.paintImageXObject||f===pdfjsLib.OPS.paintJpegXObject||f===pdfjsLib.OPS.paintImageMaskXObject));
        if(!items.length||x1-x0<vp.width*0.3||hasArt){x0=0;x1=vp.width;y0=0;y1=vp.height}else{x0=Math.max(0,x0-18);x1=Math.min(vp.width,x1+18);y0=Math.max(0,y0-18);y1=Math.min(vp.height,y1+18)}
        model.pages.push({w:vp.width,h:vp.height,items,x0,x1,y0,y1})}
      model.lines=buildLines(model.pages);markHeads(model.lines);model.lines=joinLines(model.lines);model.hasText=model.lines.length>3;
    }catch(e){model.broken=true}
  }
  if(!model.hasText){model.lines=[];if(p.pasted&&p.pasted.trim())model.lines=p.pasted.split(/\r?\n/).filter(l=>l.trim()).map(t=>({page:-1,y:0,h:0,text:t.replace(/\s+$/,''),items:[]}))}
  markHeads(model.lines);
  if(p.example&&!p.lineSet){const k=model.lines.findIndex(l=>/Repeat Rnd 1/.test(l.text));if(k>=0){p.line=k;if(p.counters&&p.counters[0])p.counters[0].line=k}p.lineSet=true}
  {const bi=bustInfo(model.lines);p.found=p.found||{};const nb=bi?bi.vals:null;if(JSON.stringify(p.found.bust||null)!==JSON.stringify(nb)){p.found.bust=nb;p.found.bustName=bi?bi.name:'';p.found.lenUnit=bi?bi.unit:'in';save()}}
  if(p.total!==model.lines.length){p.total=model.lines.length;save()}
  S.models[p.id]=model;return model}

/* ---------- finding what the pattern already says ---------- */
const GAUGE_RE=/(\d+(?:\.\d+)?)\s*(?:sts|stitches)\s*(?:and|&|,|x|×|by)?\s*(\d+(?:\.\d+)?)\s*(?:rows|rnds|rounds)[^\d\n]{0,14}?(4|10)\s*(?:"|”|″|in\b|inches|cm\b)/i;
function detect(lines){

function refreshSetup(p){const m=S.models[p.id];if(!m)return;const set=(id,h)=>{const e=$(id);if(e)e.innerHTML=h};

function knitFrame(p,model){

function repLabel(p){return p.repLen?`Repeat ${((p.rep||0)%p.repLen)+1} of ${p.repLen}`:'Repeat off'}

function textView(p,model){
  const C=convertAll(model,p);let lastPage=null;

    const c=C[i];let sep='';

/* ---------- page view ---------- */
async function pageView(p,model,host){
  const cw=host.clientWidth||Math.min(600,window.innerWidth-40);
  let cache=S.pageCache[p.id];
  if(!cache||cache.cw!==cw){cache={cw,pages:model.pages.map(pg=>{const scale=cw/((pg.x1??pg.w)-(pg.x0||0)),ph=((pg.y1??pg.h)-(pg.y0||0))*scale;const wrap=document.createElement('div');wrap.className='pg';wrap.style.height=Math.round(ph)+'px';
      const cv=document.createElement('canvas');cv.style.width=cw+'px';cv.style.height=Math.round(ph)+'px';const ld=document.createElement('div');ld.className='pload';ld.textContent='Drawing page';
      const ov=document.createElement('div');ov.className='ov';wrap.append(cv,ld,ov);return{wrap,cv,ld,ov,scale,done:false}})};S.pageCache[p.id]=cache}
  const box=document.createElement('div');box.className='pages'+(p.showOrig?' orig':'');box.id='pages';
  cache.pages.forEach(c=>box.appendChild(c.wrap));
  const st=stats(p,model);
  if(st.f&&model.hasText){const b=document.createElement('p');b.className='banner';b.innerHTML=`<i></i><span>${st.f} line${st.f>1?'s':''} to check by hand. Text view explains each one.</span>`;host.appendChild(b)}
  const sheet=document.createElement('div');sheet.className='sheet';sheet.appendChild(box);host.appendChild(sheet);
  drawOverlays(p,model);
  const doc=S.docs[p.id];if(!doc)return;
  for(let i=0;i<cache.pages.length;i++){const c=cache.pages[i];if(c.done)continue;
    try{const page=await doc.getPage(i+1);const dpr=Math.min(3,window.devicePixelRatio||1);const mp=model.pages[i],x0=mp.x0||0,y0=mp.y0||0;const vp=page.getViewport({scale:c.scale*dpr,offsetX:-x0*c.scale*dpr,offsetY:-y0*c.scale*dpr});
      c.cv.width=Math.floor(cw*dpr);c.cv.height=Math.floor(((mp.y1??mp.h)-y0)*c.scale*dpr);await page.render({canvasContext:c.cv.getContext('2d'),viewport:vp}).promise;c.done=true;c.ld.remove()}catch(e){c.ld.textContent='Could not draw this page'}}}
function itemAt(line,i){let r=line.items[0];for(const it of line.items)if(it.start<=i)r=it;return r}
function chipFor(l,off,len){const a=itemAt(l,off),b=itemAt(l,off+len-1);
  const x1=a.x+(off-a.start)/Math.max(1,a.str.length)*a.w,x2=b.x+(off+len-b.start)/Math.max(1,b.str.length)*b.w;return{x1,x2,y:a.y,h:a.h}}
function drawOverlays(p,model){
  const cache=S.pageCache[p.id];if(!cache)return;const C=model.hasText?convertAll(model,p):[];
  cache.pages.forEach(c=>{c.ov.innerHTML=''});
  const parts=cache.pages.map(()=>[]);
  model.lines.forEach((l,i)=>{
    if(l.page<0||!cache.pages[l.page])return;const c=cache.pages[l.page],k=c.scale,X=model.pages[l.page].x0||0,Y=model.pages[l.page].y0||0;
    const top=(l.top??(l.y-l.h*0.9)),bot=(l.bot??(l.y+l.h*0.3));
    if(i===p.line){const tag=model.hasText?countTag(C,i,p):'';parts[l.page].push(`<div class="ruler" id="ruler" style="top:${((top-Y-l.h*0.2)*k).toFixed(1)}px;height:${((bot-top+l.h*0.4)*k).toFixed(1)}px">${tag?`<span class="rtag">${tag}</span>`:''}</div>`)}
    if(!model.hasText)return;
    const cv=C[i];
    if(cv.flag)parts[l.page].push(`<span class="fl" style="top:${((l.y-Y-l.h*0.55)*k-4).toFixed(1)}px"></span>`);
    cv.segs.forEach(s=>{if(s.t!==undefined)return;
      const nums=[...s.src.matchAll(/\d+(?:\.\d+)?(?:st|nd|rd|th)?/gi)];if(!nums.length)return;
      const j=Math.min(p.size||0,nums.length-1),m=nums[j],v=s.n[Math.min(j,s.n.length-1)];

  cache.pages.forEach((c,i)=>{c.ov.innerHTML=parts[i].join('');c.ov.dataset.page=i})}

/* ---------- render ---------- */
async function render(scroll){
  const app=$('app');const p=cur();
  if(S.view==='home'||!p){S.view='home';app.innerHTML=home();window.scrollTo(0,0);return}
  if(!S.models[p.id])app.innerHTML='<div class="loading"><span class="eyebrow">Reading pattern</span><span class="n">…</span></div>';

function scrollToCur(){const el=$('ruler')||$('ln'+(cur()||{}).line);if(el)el.scrollIntoView({block:'center',behavior:'auto'})}
function setLine(p,i){const m=S.models[p.id];if(!m)return;i=Math.max(0,Math.min(Math.max(0,m.lines.length-1),i));p.line=i;

  const el=$('k-sts');if(!el||!m)return;const C=convertAll(m,p),sz=p.size||0;let text='',cls='sts';

    if(st){const base=countAt(C,a.line-1,sz);const live=base!=null&&!st.done?base-(sh.dec?1:-1)*sh.per*st.k:null;

/* ---------- adding and backing up ---------- */
async function addPdf(file){
  const buf=await file.arrayBuffer();
  const p={id:uid(),example:false,name:file.name.replace(/\.pdf$/i,'').replace(/[_-]+/g,' ').trim(),file:file.name,unit:'in',pat:{s:'',r:''},mine:{s:'',r:''},mult:0,plus:0,keepEven:true,size:0,row:0,rep:0,repLen:0,line:0,view:'page',showOrig:false,notes:'',pasted:'',found:{},updated:Date.now()};
  migrate(p);S.projects.push(p);S.id=p.id;S.view='setup';await putPdf(p.id,buf);
  $('app').innerHTML='<div class="loading"><span class="eyebrow">Reading pattern</span><span class="n">…</span></div>';
  const model=await ensureModel(p);
  if(model.title&&model.title.length<80&&!/^(?:untitled|document\d*|microsoft word.*)$/i.test(model.title.trim()))p.name=model.title;
  const d=detect(model.lines);
  if(d.s){p.pat={s:d.s,r:d.r};p.unit=d.unit;p.found.gauge=true}
  if(d.mult){p.mult=d.mult;p.plus=d.plus;p.found.mult=true}
  if(d.yds){p.yarnPat.yds=d.yds;p.yarnPat.g=d.g||'';p.found.label=true}
  if(d.needle)p.yarnPat.needle=d.needle;
  if(d.ease!=null){p.fit.ease=d.ease;p.found.ease=d.ease}
  touch(p);render()}
async function backup(){
  const pdfs={};for(const p of S.projects){if(p.example)continue;const b=await getPdf(p.id);if(b)pdfs[p.id]=bufToB64(b)}
  const data=JSON.stringify({app:'gauge',version:1,projects:S.projects,pdfs});
  try{await S.dl.save({filename:'gauge-backup.json',data});S.msg='Backup saved. Keep it in Files or iCloud Drive.'}
  catch(e){S.msg=e&&e.code==='declined'?'':'This view can’t save files. Open the page in your browser and try again.'}
  render()}
async function restore(file){
  try{const d=JSON.parse(await file.text());if(!d||!Array.isArray(d.projects))throw 0;
    for(const id in (d.pdfs||{}))await putPdf(id,b64ToBuf(d.pdfs[id]));
    d.projects.forEach(x=>{if(!x||!x.id||!x.pat)return;migrate(x);const i=S.projects.findIndex(y=>y.id===x.id);if(i>=0)S.projects[i]=x;else S.projects.push(x);delete S.models[x.id];delete S.pageCache[x.id]});
    save();S.msg=`Restored ${d.projects.length} project${d.projects.length===1?'':'s'}.`}
  catch(e){S.msg='That file isn’t a Gauge backup. Choose the gauge-backup.json file.'}
  render()}

    case'tsize':p.textSize=((p.textSize||0)+1)%3;touch(p);if(!$('pages'))$('kbody').innerHTML=textView(p,S.models[p.id]);else{p.view='text';render(true)}break;
    case'line':setLine(p,+b.dataset.i);updateLine(false);break;
    case'nextline':setLine(p,(p.line||0)+1);updateLine(true);break;
    case'prevline':setLine(p,(p.line||0)-1);updateLine(true);break;
    case'backup':backup();break;
    case'sug':p.mult=+b.dataset.v;p.plus=0;touch(p);render();break;
    case'del':if(!S.confirmDel){S.confirmDel=true;b.textContent='Tap again to delete'}else{S.projects=S.projects.filter(x=>x.id!==p.id);delPdf(p.id);delete S.models[p.id];delete S.pageCache[p.id];S.confirmDel=false;save();S.view='home';render()}break;
  }});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const t=e.target;if(t.id==='k-rep'){e.preventDefault();document.querySelector('[data-act=rep-set]').click()}else if(t.id==='k-pname'){e.preventDefault();const b=document.querySelector('[data-act=piece-create],[data-act=piece-save]');if(b)b.click()}});
document.addEventListener('change',e=>{
  if(e.target.id==='pdfin'&&e.target.files[0]){S.msg='';addPdf(e.target.files[0])}
  if(e.target.id==='restorein'&&e.target.files[0])restore(e.target.files[0])});
document.addEventListener('input',e=>{
  const el=e.target,p=cur();if(!p||S.view!=='setup')return;
  if(el.dataset.g){const [k,f]=el.dataset.g.split('.');p[k]=p[k]||{};
    p[k][f]=el.type==='checkbox'?el.checked:el.type==='number'?(el.value===''?'':+el.value):el.value;syncMine(p);touch(p);
    if(el.type==='checkbox'){S.keepScroll=window.scrollY;render();return}
    refreshSetup(p);return}
  else if(el.dataset.f){const f=el.dataset.f;p[f]=el.type==='checkbox'?el.checked:el.type==='number'?(el.value===''?0:+el.value):el.value;
    if(f==='pasted'){delete S.models[p.id];delete S.pageCache[p.id]}}
  else return;
  touch(p);const r=$('readout');if(r)r.innerHTML=readout(p);
  const m=S.models[p.id];if(m){const st=stats(p,m);$('st-n').textContent=st.n;$('st-f').textContent=st.f}
  if(el.dataset.f==='pasted')ensureModel(p).then(m2=>{const st=stats(p,m2);$('st-n').textContent=st.n;$('st-f').textContent=st.f})});
let rz=null;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.view==='knit'&&$('pages'))render(true)},300)});

load();render();
try{const u=window.claude&&window.claude.use&&window.claude.use('downloads');if(u&&u.then)u.then(dl=>{S.dl=dl;if(S.view==='home')render()}).catch(()=>{})}catch(e){}
})();
</script>

</body>
</html>
